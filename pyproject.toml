[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tendencia-politica"
version = "0.1.0"
description = "Pipeline de análisis de cobertura de prensa — elecciones Perú segunda vuelta"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "anthropic>=0.28",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "jinja2>=3.1",
    "scikit-learn>=1.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
playwright = ["playwright>=1.44"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
captura = "tendencia.cli:captura"
analisis = "tendencia.cli:analisis"

[tool.hatch.build.targets.wheel]
packages = ["src/tendencia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
